name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          for z in $(find . -name "*.zip" -not -path "./.git/*"); do unzip -o "$z" -d "$(dirname "$z")"; done
          S=$(find . -name settings.gradle -not -path "./.git/*" | head -n1)
          echo "PROJECT_DIR=$(dirname "$S")" >> $GITHUB_ENV
      - name: Fix code
        run: |
          for f in $(find . -name Engine.java -path "*ultrafps*"); do
            perl -0pi -e 's/\s*if \(o\.graphicsMode\(\)\.get\(\) == GraphicsStatus\.FABULOUS\) \{.*?\n\s*\}\n/\n/s; s/\s*if \(tier >= 2 && cfg\.allowFastGraphics && !shader\) \{.*?\n\s*\}\n/\n/s; s/import net\.minecraft\.client\.GraphicsStatus;\n//' "$f"
            grep -n "graphicsMode\|GraphicsStatus" "$f" || echo "clean: $f"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: gradle build --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-fps-engine
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
