name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          for z in $(find . -name "*.zip" -not -path "./.git/*"); do unzip -o "$z" -d "$(dirname "$z")"; done
          S=$(find . -name settings.gradle -not -path "./.git/*" | head -n1)
          echo "PROJECT_DIR=$(dirname "$S")" >> $GITHUB_ENV
      - name: Fix code
        run: |
          python3 - <<'PY'
          import glob
          for f in glob.glob('**/Engine.java', recursive=True):
              s = open(f).read()
              s = s.replace('import net.minecraft.client.ParticleStatus;', 'import net.minecraft.server.level.ParticleStatus;')
              out, skip, depth = [], False, 0
              for line in s.split('\n'):
                  if skip:
                      depth += line.count('{') - line.count('}')
                      if depth <= 0:
                          skip = False
                      continue
                  if 'GraphicsStatus' in line or 'graphicsMode' in line:
                      if line.strip().startswith('if') and '{' in line:
                          skip, depth = True, line.count('{') - line.count('}')
                      continue
                  out.append(line)
              open(f, 'w').write('\n'.join(out))
              print('fixed', f)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle build --no-daemon --console=plain > build.log 2>&1 || { grep -n "error:" build.log | head -20; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-fps-engine
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
